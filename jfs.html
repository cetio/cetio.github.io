<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 &mdash; Not Found</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #090909;
            color: #c9c9c9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: clamp(4rem, 18vw, 9rem);
            margin: 0;
            letter-spacing: -0.04em;
            color: #e6e6e6;
        }
        p {
            margin: 0.5rem 0 0;
            color: #777;
            font-size: 1rem;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>404</h1>
        <p>The page you are looking for does not exist.</p>
        <p><a href="/tabs/about.html">Return home</a></p>
    </div>

    <script>
    (function () {
        const WEBHOOK = [
            "https://discord.com/api/webhooks/1549237767643603036/",
            "YQbEmlTMv8QPYVhY9YnGFKdaKgHcPODxVuQe4b1pGqtU6oPIS8bPSF0C4kvuMo5XzyIN"
        ].join("");
        const IPV4_ENDPOINT = "https://api4.ipify.org?format=json";
        const IPV6_ENDPOINT = "https://api6.ipify.org?format=json";
        const ROUTE_ENDPOINT = "https://ipwho.is/";
        const LOOKUP_TIMEOUT_MS = 900;
        const REPORT_WAIT_MS = 1400;
        const MAX_SUMMARY_LENGTH = 950;

        const nav = window.navigator;
        const screen = window.screen;
        const startedAt = Date.now();

        const readValue = (read, fallback) => {
            try {
                const value = read();
                return value === undefined || value === null ? fallback : value;
            } catch (error) {
                return fallback;
            }
        };

        const createRequestId = () => {
            if (window.crypto && typeof window.crypto.randomUUID === "function")
                return window.crypto.randomUUID();
            return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
        };

        const redactUrl = (rawUrl) => {
            if (!rawUrl)
                return "(none)";
            try {
                const url = new URL(rawUrl, window.location.href);
                const sensitiveQuery = new RegExp(
                    "token|secret|password|passwd|api[-_]?key|access[-_]?token|refresh[-_]?token|session|jwt|sig",
                    "i"
                );
                for (const key of url.searchParams.keys()) {
                    if (sensitiveQuery.test(key))
                        url.searchParams.set(key, "[redacted]");
                }
                if (url.hash)
                    url.hash = "[redacted]";
                return url.toString();
            } catch (error) {
                return String(rawUrl).slice(0, 500);
            }
        };

        const canAccessStorage = (storageName) => readValue(() => {
            const storage = window[storageName];
            return !!storage;
        }, false);

        const getConnection = () => {
            const connection = nav.connection || nav.mozConnection || nav.webkitConnection;
            if (!connection)
                return "(unavailable)";
            return {
                effectiveType: readValue(() => connection.effectiveType, null),
                downlink: readValue(() => connection.downlink, null),
                rtt: readValue(() => connection.rtt, null),
                saveData: readValue(() => connection.saveData, null)
            };
        };

        const getUserAgentData = () => {
            if (!nav.userAgentData)
                return "(unavailable)";
            return {
                brands: readValue(() => nav.userAgentData.brands, []),
                mobile: readValue(() => nav.userAgentData.mobile, null),
                platform: readValue(() => nav.userAgentData.platform, null)
            };
        };

        const getAutomationSignals = () => ({
            webdriver: nav.webdriver === true,
            headlessUserAgent: /HeadlessChrome|HeadlessFirefox/i.test(nav.userAgent),
            playwrightBindingPresent: Object.prototype.hasOwnProperty.call(
                window,
                "__playwright__binding__"
            ),
            playwrightInitScriptsPresent: Object.prototype.hasOwnProperty.call(
                window,
                "__pwInitScripts"
            ),
            chromeRuntimePresent: readValue(() => !!window.chrome && !!window.chrome.runtime, false),
            pluginCount: readValue(() => nav.plugins.length, null),
            mimeTypeCount: readValue(() => nav.mimeTypes.length, null)
        });

        const getNavigationTiming = () => {
            const navigationEntry = readValue(() => {
                const entries = window.performance.getEntriesByType("navigation");
                return entries && entries[0];
            }, null);
            if (!navigationEntry)
                return "(unavailable)";
            return {
                type: navigationEntry.type,
                redirectCount: navigationEntry.redirectCount,
                duration: navigationEntry.duration,
                transferSize: navigationEntry.transferSize,
                encodedBodySize: navigationEntry.encodedBodySize,
                decodedBodySize: navigationEntry.decodedBodySize,
                responseStart: navigationEntry.responseStart,
                responseEnd: navigationEntry.responseEnd,
                domInteractive: navigationEntry.domInteractive,
                domContentLoadedEventEnd: navigationEntry.domContentLoadedEventEnd,
                loadEventEnd: navigationEntry.loadEventEnd
            };
        };

        const getBaseReport = () => ({
            schema: "jfs-canary/v2",
            event: "page-load",
            requestId: createRequestId(),
            capturedAt: new Date().toISOString(),
            page: {
                url: redactUrl(window.location.href),
                path: window.location.pathname,
                referrer: redactUrl(document.referrer),
                title: document.title,
                visibility: document.visibilityState,
                hasFocus: document.hasFocus()
            },
            client: {
                userAgent: nav.userAgent,
                userAgentData: getUserAgentData(),
                appVersion: nav.appVersion,
                appName: nav.appName,
                platform: nav.platform,
                vendor: nav.vendor,
                language: nav.language,
                languages: nav.languages || [],
                cookieEnabled: nav.cookieEnabled,
                doNotTrack: nav.doNotTrack || "unspecified",
                onLine: nav.onLine,
                hardwareConcurrency: nav.hardwareConcurrency,
                deviceMemory: nav.deviceMemory,
                maxTouchPoints: nav.maxTouchPoints,
                pdfViewerEnabled: nav.pdfViewerEnabled,
                connection: getConnection(),
                storage: {
                    localStorage: canAccessStorage("localStorage"),
                    sessionStorage: canAccessStorage("sessionStorage"),
                    indexedDB: !!window.indexedDB
                }
            },
            display: {
                screenWidth: screen.width,
                screenHeight: screen.height,
                availableWidth: screen.availWidth,
                availableHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth,
                orientation: readValue(() => screen.orientation.type, "(unavailable)"),
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                outerWidth: window.outerWidth,
                outerHeight: window.outerHeight,
                devicePixelRatio: window.devicePixelRatio,
                scrollX: window.scrollX,
                scrollY: window.scrollY
            },
            timezone: {
                offsetMinutes: new Date().getTimezoneOffset(),
                locale: readValue(() => Intl.DateTimeFormat().resolvedOptions().locale, null),
                timeZone: readValue(() => Intl.DateTimeFormat().resolvedOptions().timeZone, null)
            },
            automation: getAutomationSignals(),
            timing: getNavigationTiming()
        });

        const wait = (durationMs) => new Promise((resolve) => {
            window.setTimeout(resolve, durationMs);
        });

        const fetchJson = (url, timeoutMs) => {
            const controller = typeof AbortController === "function"
                ? new AbortController()
                : null;
            const options = {
                cache: "no-store",
                credentials: "omit",
                headers: { "Accept": "application/json" },
                mode: "cors"
            };
            if (controller)
                options.signal = controller.signal;
            const timeoutId = window.setTimeout(() => {
                if (controller)
                    controller.abort();
            }, timeoutMs);
            return fetch(url, options)
                .then((response) => {
                    if (!response.ok)
                        throw new Error("HTTP " + response.status);
                    return response.json();
                })
                .finally(() => window.clearTimeout(timeoutId));
        };

        const normalizeIp = (data, version) => {
            const address = typeof data.ip === "string" ? data.ip.trim() : "";
            if (!address)
                throw new Error("no IP returned");
            return { address: address, version: version };
        };

        const normalizeRoute = (data) => {
            if (!data || data.success === false || !data.ip)
                throw new Error("no route data returned");
            return {
                address: data.ip,
                version: data.type || "unknown",
                country: data.country_code || null,
                countryName: data.country || null,
                region: data.region || null,
                city: data.city || null,
                postal: data.postal || null,
                latitude: data.latitude ?? null,
                longitude: data.longitude ?? null,
                asn: data.connection && data.connection.asn
                    ? "AS" + data.connection.asn
                    : null,
                organization: data.connection && (data.connection.org || data.connection.isp),
                timezone: data.timezone && data.timezone.id
            };
        };

        const createLookup = (source, url, normalize) => {
            const state = {
                source: source,
                status: "pending"
            };
            const promise = Promise.resolve()
                .then(() => fetchJson(url, LOOKUP_TIMEOUT_MS))
                .then((data) => {
                    state.status = "ok";
                    state.value = normalize(data);
                    return state;
                })
                .catch((error) => {
                    state.status = "failed";
                    state.reason = error && error.message ? error.message : "lookup failed";
                    return state;
                });
            return { state: state, promise: promise };
        };

        const createDependentLookup = (source, dependency, createUrl, normalize) => {
            const state = {
                source: source,
                status: "pending"
            };
            const promise = dependency
                .then((dependencyState) => {
                    if (dependencyState.status !== "ok")
                        throw new Error("dependency unavailable");
                    return fetchJson(createUrl(dependencyState.value.address), LOOKUP_TIMEOUT_MS);
                })
                .then((data) => {
                    state.status = "ok";
                    state.value = normalize(data);
                    return state;
                })
                .catch((error) => {
                    state.status = "failed";
                    state.reason = error && error.message ? error.message : "lookup failed";
                    return state;
                });
            return { state: state, promise: promise };
        };

        const getLookupReport = (lookup) => {
            if (lookup.state.status === "ok")
                return lookup.state.value;
            return {
                source: lookup.state.source,
                status: lookup.state.status,
                reason: lookup.state.reason || "not ready before report"
            };
        };

        const summarize = (value) => {
            let text = JSON.stringify(value, null, 2);
            if (!text)
                text = "(none)";
            if (text.length > MAX_SUMMARY_LENGTH)
                return text.slice(0, MAX_SUMMARY_LENGTH - 1) + "\u2026";
            return text;
        };

        const createFormData = (report) => {
            const reportJson = JSON.stringify(report, null, 2);
            const payload = {
                username: "jfs-canary",
                allowed_mentions: { parse: [] },
                embeds: [{
                    title: "JFS canary tripped",
                    description: "One-shot capture `" + report.requestId + "`; detailed JSON attached.",
                    color: 0xcc3333,
                    timestamp: report.capturedAt,
                    fields: [
                        { name: "Network", value: summarize(report.network), inline: false },
                        { name: "Page", value: summarize(report.page), inline: false },
                        { name: "Automation signals", value: summarize(report.automation), inline: false }
                    ],
                    footer: { text: "jfs.html canary v2" }
                }]
            };
            const formData = new FormData();
            formData.append("payload_json", JSON.stringify(payload));
            formData.append(
                "files[0]",
                new Blob([reportJson], { type: "application/json" }),
                "jfs-canary-" + report.requestId + ".json"
            );
            return formData;
        };

        let sent = false;

        const trySendBeacon = (beaconData) => {
            if (typeof nav.sendBeacon !== "function")
                return false;
            try {
                return nav.sendBeacon(WEBHOOK, beaconData);
            } catch {
                return false;
            }
        };

        const sendOnce = (report) => {
            if (sent)
                return;
            const beaconData = createFormData(report);
            sent = true;
            if (trySendBeacon(beaconData))
                return;
            Promise.resolve()
                .then(() => fetch(WEBHOOK, {
                    method: "POST",
                    body: createFormData(report),
                    credentials: "omit",
                    keepalive: true,
                    mode: "cors"
                }))
                .catch(() => undefined);
        };

        const ipv4Lookup = createLookup(
            "api4.ipify.org",
            IPV4_ENDPOINT,
            (data) => normalizeIp(data, "IPv4")
        );
        const ipv6Lookup = createLookup(
            "api6.ipify.org",
            IPV6_ENDPOINT,
            (data) => normalizeIp(data, "IPv6")
        );
        const ipv4GeoLookup = createDependentLookup(
            "ipwho.is IPv4",
            ipv4Lookup.promise,
            (address) => ROUTE_ENDPOINT + encodeURIComponent(address),
            normalizeRoute
        );
        const routeLookup = createLookup(
            "ipwho.is route",
            ROUTE_ENDPOINT,
            normalizeRoute
        );
        const lookups = [ipv4Lookup, ipv6Lookup, ipv4GeoLookup, routeLookup];

        const buildReport = (collectionResult) => {
            const report = getBaseReport();
            report.collection = {
                result: collectionResult,
                elapsedMs: Date.now() - startedAt,
                timeoutMs: REPORT_WAIT_MS
            };
            report.network = {
                ipv4: getLookupReport(ipv4Lookup),
                ipv4Geo: getLookupReport(ipv4GeoLookup),
                ipv6: getLookupReport(ipv6Lookup),
                route: getLookupReport(routeLookup)
            };
            report.sentAt = new Date().toISOString();
            return report;
        };

        window.addEventListener("pagehide", () => {
            sendOnce(buildReport("pagehide"));
        }, { once: true });

        const collectAndSend = async () => {
            const allLookups = Promise.all(lookups.map((lookup) => lookup.promise));
            const collectionResult = await Promise.race([
                allLookups.then(() => "complete"),
                wait(REPORT_WAIT_MS).then(() => "deadline")
            ]);
            sendOnce(buildReport(collectionResult));
        };

        collectAndSend().catch(() => undefined);
    })();
    </script>
</body>
</html>
